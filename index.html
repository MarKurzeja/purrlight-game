<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Purrlight</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <meta
      name="description"
      content="A cozy low-poly 3D village sim about winning over wary mountain cats."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span class="hud-pill">
          <span id="when"></span>
          <span id="phase"></span>
          <span id="sun-track" aria-hidden="true"><i id="sun"></i></span>
        </span>
        <span class="spacer"></span>
        <span class="hud-pill"><b id="purrs">0</b> Purrs</span>
        <button
          class="hud-button"
          id="help-button"
          aria-label="How to play"
          title="How to play (H)"
        >
          ?
        </button>
        <button class="hud-button" id="journal-button">Journal</button>
        <button class="hud-button" id="music-toggle">Music on</button>
      </header>
      <main id="stage-wrap">
        <div id="stage">
          <canvas id="world3d" aria-hidden="true"></canvas>
          <canvas
            id="pixels"
            width="480"
            height="270"
            aria-label="The village of Purrwind Alp"
          ></canvas>
          <div id="paper"></div>
          <canvas id="overlay"></canvas>
          <aside id="goals" hidden aria-live="polite"></aside>
        </div>
      </main>
      <nav id="tools" hidden aria-label="Tools"></nav>
      <footer id="bar">
        <span id="hint"></span>
        <button id="sit" class="hud-button" hidden>Sit quietly</button>
        <button id="next" hidden></button>
      </footer>
    </div>
    <div id="banner"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="celebration" hidden aria-live="polite"></div>
    <div id="modal" hidden><div id="sheet" class="sheet"></div></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
